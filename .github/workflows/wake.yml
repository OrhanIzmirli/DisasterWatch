# Scheduled wake-up of the Render free-plan services (they sleep after ~15 min without traffic).
#
# 1. POST the backend's /internal/ingest with the shared secret: a sleeping backend wakes and
#    ingests on start, an awake one ingests unless a run worked in the last 10 minutes; new
#    events go to Kafka. The endpoint answers within a minute: 200 with the run's result, or
#    202 when the run is still going (it is then followed on /health until it ends).
# 2. GET the notification service's /health: it wakes and consumes what is waiting in Kafka.
# 3. Publish the dashboard feed the backend now serves as a static snapshot (branch
#    feed-snapshot, a single commit replaced on every run). The site serves it at
#    /snapshot/feed.json (a Render rewrite, docs/operations.md), so a visitor who arrives while
#    the backend sleeps sees the last data at once, labelled with its age, instead of waiting.
#
# Setup (values never in the repository):
#   Settings -> Secrets and variables -> Actions
#     Secrets:   INGEST_WAKE_SECRET  (same value as the backend's Render env var; 32+ characters)
#     Variables: BACKEND_URL         (backend service URL, no trailing slash)
#                NOTIFICATION_URL    (notification service URL, no trailing slash)
#
# GitHub delays or skips scheduled runs under load (in practice this runs every few hours, not
# every hour) and disables a schedule after 60 days without repository activity. It is the only
# scheduler: Render's edge refused an external cron service's requests to a sleeping service
# (503, x-render-routing: hibernate-wake-error) while requests from a GitHub runner wake it.
# /health -> ingest.lastWakeAt shows when the last wake-up arrived (the endpoint is idempotent,
# a run in progress is joined); "Run workflow" under Actions runs it by hand.
name: Scheduled wake

on:
  schedule:
    # minute 22 of every hour on paper; GitHub runs it when it has capacity (every few hours)
    - cron: "22 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    # worst case: 3 attempts of (backend 3 x 120 s + 2 x 20 s, following the run 6 min) + 2 x 60 s, notification 3 x 60 s + 2 x 20 s = 2620 s
    timeout-minutes: 45
    steps:
      - name: Wake the backend and ingest now
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          INGEST_WAKE_SECRET: ${{ secrets.INGEST_WAKE_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$INGEST_WAKE_SECRET" ]; then
            echo "::error::Set the BACKEND_URL variable and the INGEST_WAKE_SECRET secret (see the comment at the top of wake.yml)"
            exit 1
          fi
          # A part of a run can fail for a moment (a source that does not answer during a cold start):
          # the endpoint then says 200 with ok:false, which curl's own retries do not cover. Each new
          # call really runs again (a failed run does not count as recent, and the service is awake).
          # A wrong secret or a run that never ends is not retried.
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            # a cold start takes up to about a minute and the endpoint answers within another minute;
            # connection failures and timeouts are retried by curl
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 20 --retry-all-errors \
              -X POST "$BACKEND_URL/internal/ingest" -H "Authorization: Bearer $INGEST_WAKE_SECRET")
            echo "HTTP $code (attempt $attempt of $attempts)"
            cat body.json; echo
            case "$code" in
              200)
                grep -q '"ok":true' body.json && exit 0
                ;;
              202)
                # the run outlasted the endpoint's wait (after a long sleep its GDACS lookups can take
                # minutes): follow it on the public /health until it ends, at most 6 minutes
                echo "the ingestion is still running; following it on /health"
                deadline=$((SECONDS + 360))
                finished=
                while [ "$SECONDS" -lt "$deadline" ]; do
                  sleep 15
                  curl -sS --max-time 20 -o health.json "$BACKEND_URL/health" || continue
                  jq -e '.ingest.running == false and .ingest.lastRunAt != null' health.json > /dev/null || continue
                  jq -c '.ingest' health.json
                  [ -n "$(jq -r '.ingest.lastErrorSources | join(", ")' health.json)" ] || exit 0
                  finished=1
                  break
                done
                [ -n "$finished" ] || { echo "::error::the ingestion did not finish within 6 minutes of the call (see /health -> ingest)"; exit 1; }
                ;;
              *)
                exit 1
                ;;
            esac
            if [ "$attempt" -lt "$attempts" ]; then
              echo "a part of the ingestion failed; trying again in 60 s"
              sleep 60
            fi
          done
          # still failing: GitHub reports it (/health -> ingest.lastErrorSources names the part)
          echo "::error::the ingestion reported a failure in all $attempts attempts (see the counts above and /health -> ingest.lastErrorSources; Kafka may be powered off)"
          exit 1

      - name: Wake the notification service
        if: always()
        env:
          NOTIFICATION_URL: ${{ vars.NOTIFICATION_URL }}
        run: |
          if [ -z "$NOTIFICATION_URL" ]; then
            echo "::error::Set the NOTIFICATION_URL variable (see the comment at the top of wake.yml)"
            exit 1
          fi
          curl -fsS --max-time 60 --retry 2 --retry-delay 20 --retry-all-errors "$NOTIFICATION_URL/health"; echo

  snapshot:
    needs: wake
    # also after a failed ingestion: the feed itself is checked below and only a complete one is published
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # this job only: it pushes the feed-snapshot branch
    steps:
      - name: Publish the feed snapshot
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Set the BACKEND_URL variable (see the comment at the top of wake.yml)"
            exit 1
          fi
          mkdir snapshot && cd snapshot
          curl -fsS --max-time 120 --retry 2 --retry-delay 20 --retry-all-errors -o raw.json "$BACKEND_URL/disasters?limit=200"
          # only a complete, current feed replaces the published one (never a stale, partial or empty one)
          if ! jq -e '(.items | length) > 0 and .stale == false and .partial == false and (.updatedAt | type) == "string"' raw.json > /dev/null; then
            echo "::warning::the feed is stale, partial or empty; the previous snapshot stays"
            exit 0
          fi
          jq -c . raw.json > feed.json
          rm raw.json
          jq -c '{updatedAt, count, sources}' feed.json
          git init -q -b feed-snapshot
          git add feed.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Feed snapshot $(jq -r .updatedAt feed.json) [skip ci]"
          # one commit, replaced every run: the branch never grows
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push -q --force "https://github.com/$GITHUB_REPOSITORY.git" feed-snapshot
