# Hourly wake-up of the Render free-plan services (they sleep after ~15 min without traffic).
#
# 1. POST the backend's /internal/ingest with the shared secret: a sleeping backend wakes and
#    ingests on start, an awake one ingests unless a run worked in the last 10 minutes; new
#    events go to Kafka. The endpoint answers within a minute: 200 with the run's result, or
#    202 when the run is still going (it is then followed on /health until it ends).
# 2. GET the notification service's /health: it wakes and consumes what is waiting in Kafka.
#
# Setup (values never in the repository):
#   Settings -> Secrets and variables -> Actions
#     Secrets:   INGEST_WAKE_SECRET  (same value as the backend's Render env var; 32+ characters)
#     Variables: BACKEND_URL         (backend service URL, no trailing slash)
#                NOTIFICATION_URL    (notification service URL, no trailing slash)
#
# GitHub disables scheduled workflows after 60 days without repository activity, and delays or
# skips scheduled runs under load. /health -> ingest.lastWakeAt shows when the last wake-up
# arrived. The primary scheduler is an external cron service calling the same two URLs at minute
# 17; this workflow is the backup (the endpoint is idempotent, a run in progress is joined).
name: Scheduled wake

on:
  schedule:
    # backup at :22, five minutes after the primary :17 call: the services are still awake from
    # that call, so it opens no second awake window, only extends the existing one by ~5 min
    # (Render's idle timer restarts); it wakes them if the primary call did not arrive
    - cron: "22 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    # worst case: backend 3 x 120 s + 2 x 20 s, following the run 6 min, notification 3 x 60 s + 2 x 20 s = 980 s
    timeout-minutes: 18
    steps:
      - name: Wake the backend and ingest now
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          INGEST_WAKE_SECRET: ${{ secrets.INGEST_WAKE_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$INGEST_WAKE_SECRET" ]; then
            echo "::error::Set the BACKEND_URL variable and the INGEST_WAKE_SECRET secret (see the comment at the top of wake.yml)"
            exit 1
          fi
          # a cold start takes up to about a minute and the endpoint answers within another minute;
          # connection failures and timeouts are retried
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST "$BACKEND_URL/internal/ingest" -H "Authorization: Bearer $INGEST_WAKE_SECRET")
          echo "HTTP $code"
          cat body.json; echo
          case "$code" in
            200)
              # a run with a failed part (source fetch, Kafka publish) fails the job, so GitHub reports it
              grep -q '"ok":true' body.json || { echo "::error::the ingestion reported a failure (see the counts above; Kafka may be powered off)"; exit 1; }
              ;;
            202)
              # the run outlasted the endpoint's wait (after a long sleep its GDACS lookups can take
              # minutes): follow it on the public /health until it ends, at most 6 minutes
              echo "the ingestion is still running; following it on /health"
              deadline=$((SECONDS + 360))
              while [ "$SECONDS" -lt "$deadline" ]; do
                sleep 15
                curl -sS --max-time 20 -o health.json "$BACKEND_URL/health" || continue
                jq -e '.ingest.running == false and .ingest.lastRunAt != null' health.json > /dev/null || continue
                jq -c '.ingest' health.json
                failed=$(jq -r '.ingest.lastErrorSources | join(", ")' health.json)
                [ -z "$failed" ] || { echo "::error::the ingestion reported a failure in: $failed (Kafka may be powered off)"; exit 1; }
                exit 0
              done
              echo "::error::the ingestion did not finish within 6 minutes of the call (see /health -> ingest)"
              exit 1
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Wake the notification service
        if: always()
        env:
          NOTIFICATION_URL: ${{ vars.NOTIFICATION_URL }}
        run: |
          if [ -z "$NOTIFICATION_URL" ]; then
            echo "::error::Set the NOTIFICATION_URL variable (see the comment at the top of wake.yml)"
            exit 1
          fi
          curl -fsS --max-time 60 --retry 2 --retry-delay 20 --retry-all-errors "$NOTIFICATION_URL/health"; echo
