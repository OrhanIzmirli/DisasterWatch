server {
  listen 80;
  server_name _;

  # React/Vite SPA
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # API proxy -> backend (docker-compose service name)
  location ^~ /api/ {
    # /api/news  -> /news
    # /api/disasters -> /disasters
    # set before rewrite: "rewrite ... break" stops the rewrite-module directives after it
    set $backend_upstream http://backend:5000;
    rewrite ^/api/?(.*)$ /$1 break;

    # Resolve the service name per request (Docker's DNS, cached 10 s): a backend
    # container that is recreated gets a new IP, which a fixed proxy_pass would keep
    # missing until nginx restarts (502 "Degraded" on every page).
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_pass $backend_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Avoid 504s (the disasters endpoint can be slow)
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    proxy_redirect off;
  }
}
